catalog_version: 1

# Assembly convention for package drawings:
# - look at the marked/flat face of the component;
# - hold the leads pointing down;
# - read lead numbers from left to right.
packages:
  TO-92:
    marked_face: flat
    marked_face_lead_order: [1, 2, 3]
    leads_direction: down
    body_side: right_of_pin1_to_pin3
